<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Расписание ИТК37</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <main class="app-shell">
        <section class="hero" aria-labelledby="pageTitle">
            <div class="brand">
                <img src="assets/ivtech-logo.png" alt="" />
                <div>
                    <p>Ивановский технический колледж</p>
                    <h1 id="pageTitle">Расписание занятий</h1>
                    <span id="dateHeader" class="period">Загрузка Excel-файла...</span>
                </div>
            </div>
            <div class="source-card" aria-live="polite">
                <span class="source-card__label">Источник</span>
                <strong id="sourceStatus">schedule.xls</strong>
                <span id="lessonCount">0 занятий</span>
            </div>
        </section>

        <section class="workspace" aria-label="Поиск расписания">
            <div class="panel controls-panel">
                <div class="tabs" role="tablist" aria-label="Вид расписания">
                    <button id="tabGroup" class="tab active" type="button" role="tab" aria-selected="true" data-view="group">
                        По группам
                    </button>
                    <button id="tabTeacher" class="tab" type="button" role="tab" aria-selected="false" data-view="teacher">
                        По преподавателям
                    </button>
                </div>

                <label class="field" for="entitySearch">
                    <span id="searchLabel">Найти группу</span>
                    <input id="entitySearch" type="search" autocomplete="off" placeholder="Начните вводить номер или название" />
                </label>

                <label id="groupSection" class="field" for="groupSelect">
                    <span>Группа</span>
                    <select id="groupSelect">
                        <option value="">Загрузка групп...</option>
                    </select>
                </label>

                <label id="teacherSection" class="field" for="teacherSelect" hidden>
                    <span>Преподаватель</span>
                    <select id="teacherSelect">
                        <option value="">Загрузка преподавателей...</option>
                    </select>
                </label>

                <div>
                    <div class="quick-title">Быстрый выбор</div>
                    <div id="quickPicks" class="quick-picks" aria-live="polite"></div>
                </div>
            </div>

            <section id="schedule" class="schedule-view" aria-live="polite">
                <div class="empty-state">
                    <p class="empty-state__title">Выберите группу или преподавателя</p>
                    <p>Расписание появится здесь по дням недели.</p>
                </div>
            </section>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
